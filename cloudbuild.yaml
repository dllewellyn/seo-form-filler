steps:
  # Build the container image (Firebase VITE_* vars are baked in at build time)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:latest'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID'
      - '.'

  # Push the image tagged with the commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:$COMMIT_SHA'

  # Push the image tagged as latest
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:latest'

  # Substitute the placeholder image URL in cloudrun.yaml and deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed 's|DOCKER_IMAGE_URL_PLACEHOLDER|$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:$COMMIT_SHA|g' cloudrun.yaml > /tmp/cloudrun-deploy.yaml
        gcloud run services replace /tmp/cloudrun-deploy.yaml --region=$_REGION

# Store the built images in Artifact Registry
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/seo-form-filler:latest'

# Substitution variable defaults (override in Cloud Build trigger settings)
substitutions:
  _REGION: europe-west1
  _REPOSITORY: seo-form-filler
  _VITE_FIREBASE_API_KEY: AIzaSyBKvFEyDSBLNIO9k2eCWDWZVEfz27R99CU
  _VITE_FIREBASE_AUTH_DOMAIN: studio-4617923657-a8cda.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: studio-4617923657-a8cda
  _VITE_FIREBASE_STORAGE_BUCKET: studio-4617923657-a8cda.firebasestorage.app
  _VITE_FIREBASE_MESSAGING_SENDER_ID: "228543204937"
  _VITE_FIREBASE_APP_ID: 1:228543204937:web:edfd7943346534be13f998

options:
  logging: CLOUD_LOGGING_ONLY
